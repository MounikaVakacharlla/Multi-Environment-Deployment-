name: Multi-Environment CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest tests/

      - name: Build Application
        run: |
          python setup.py sdist

  deploy-staging:
    name: Deploy to Staging
    needs: build-test
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t cicd-app .

      - name: Run Staging Container
        run: |
          docker run -d -p 5000:5000 --name staging-container cicd-app

      - name: Verify Running Containers
        run: |
          docker ps

      - name: Smoke Test
        run: |
          sleep 10
          curl http://localhost:5000

      - name: Simulate Staging Deployment
        run: |
          echo "Deploying to ${{ secrets.STAGING_ENV }}"
          echo "Using key: ${{ secrets.STAGING_KEY }}"
          echo "Staging deployment completed successfully."

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Simulate Production Deployment
        run: |
          echo "Deploying to ${{ secrets.PROD_ENV }}"
          echo "Using key: ${{ secrets.PROD_KEY }}"
          echo "Production deployment completed successfully."

      - name: Verify Production Deployment
        run: |
          echo "Running production smoke test..."
          echo "Production environment is working correctly."

  notifications:
    name: Pipeline Notifications
    needs:
      - build-test
      - deploy-staging
      - deploy-production

    runs-on: ubuntu-latest

    if: always()

    steps:

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: GitHub Actions CI/CD Pipeline Status

          body: |
            Multi-Environment CI/CD Pipeline Execution Completed.

            Workflow Details:
            - Build and Test Completed
            - Staging Deployment Completed
            - Production Deployment Completed

            Check GitHub Actions logs for complete details.

          to: vakacharlamounika861@gmail.com
          from: GitHub Actions

